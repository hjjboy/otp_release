<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OTP Forwarder</title>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <style>
    :root {
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --bg: #090d16;
      --card-bg: #131b2e;
      --text: #f8fafc;
      --text-muted: #64748b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }
    .card {
      background-color: var(--card-bg);
      border: 1px solid #1e293b;
      border-radius: 24px;
      padding: 40px 32px;
      max-width: 380px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.7);
    }
    .app-icon {
      width: 72px;
      height: 72px;
      background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
      border-radius: 18px;
      margin: 0 auto 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
    }
    h1 { font-size: 22px; font-weight: 700; margin-bottom: 8px; letter-spacing: -0.02em; }
    .badge {
      display: inline-block;
      background-color: #1e293b;
      color: #93c5fd;
      font-size: 13px;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 9999px;
      margin-bottom: 24px;
    }
    .btn-download {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      background-color: var(--primary);
      color: #ffffff;
      text-decoration: none;
      font-size: 15px;
      font-weight: 600;
      padding: 13px 20px;
      border-radius: 12px;
      transition: all 0.2s ease;
    }
    .btn-download:hover {
      background-color: var(--primary-hover);
      transform: translateY(-1px);
    }
    .qr-section {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid #1e293b;
    }
    .qr-box {
      background: #ffffff;
      padding: 10px;
      border-radius: 12px;
      display: inline-block;
      margin-top: 8px;
    }
    .meta { font-size: 11px; color: var(--text-muted); margin-top: 20px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="app-icon">📲</div>
    <h1>OTP Forwarder</h1>
    <div class="badge">v1.0.7</div>

    <a href="otp-release.apk" class="btn-download" download>
      <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
      </svg>
      Download APK
    </a>

    <div class="qr-section">
      <div class="qr-box" id="qrcode"></div>
    </div>

    <p class="meta">Android 7.0+ · Updated 2026-09-02 05:28:30 UTC</p>
  </div>

  <script>
    const apkUrl = new URL('otp-release.apk', window.location.href).href;
    new QRCode(document.getElementById("qrcode"), {
      text: apkUrl,
      width: 128,
      height: 128,
      colorDark : "#000000",
      colorLight : "#ffffff",
      correctLevel : QRCode.CorrectLevel.M
    });
  </script>
</body>
</html>
